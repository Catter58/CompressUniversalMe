name: Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  # First run tests to ensure code is valid
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
          - os: macos-latest
            build_type: Release
          - os: windows-latest
            build_type: Release

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCOMPRESSUM_BUILD_TESTS=ON

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCOMPRESSUM_BUILD_TESTS=ON

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config ${{ matrix.build_type }} -j

    - name: Test (Unix)
      if: runner.os != 'Windows'
      run: cd build && ctest --output-on-failure

    - name: Test (Windows)
      if: runner.os == 'Windows'
      run: cd build && ctest -C ${{ matrix.build_type }} --output-on-failure

  # Build release binaries
  build-release:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            artifact: cum
          - os: macos-latest
            name: macos-arm64
            artifact: cum
          - os: windows-latest
            name: windows-x64
            artifact: cum.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCOMPRESSUM_STATIC=ON

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCOMPRESSUM_STATIC=ON

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release -j

    - name: Package
      run: |
        mkdir -p dist
        cp build/${{ matrix.artifact }} dist/ 2>/dev/null || cp build/Release/${{ matrix.artifact }} dist/
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cum-${{ matrix.name }}
        path: dist/

  # Create GitHub release with all binaries
  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate version
      id: version
      run: |
        # Generate version from date and short commit hash
        VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archives
      run: |
        cd artifacts
        for dir in */; do
          name="${dir%/}"
          cd "$name"
          if [[ "$name" == *"windows"* ]]; then
            zip "../${name}.zip" *
          else
            tar -czvf "../${name}.tar.gz" *
          fi
          cd ..
        done
        ls -la

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: CompressUM ${{ steps.version.outputs.version }}
        body: |
          ## CompressUM Release ${{ steps.version.outputs.version }}

          Automated release from main branch.

          ### Downloads
          - **Linux (x64)**: `cum-linux-x64.tar.gz`
          - **macOS (ARM64)**: `cum-macos-arm64.tar.gz`
          - **Windows (x64)**: `cum-windows-x64.zip`

          ### Usage
          ```bash
          # Compress
          ./cum compress input.txt -o output.cum

          # Decompress
          ./cum decompress output.cum -o restored.txt

          # Analyze
          ./cum analyze input.txt
          ```
        files: |
          artifacts/cum-linux-x64.tar.gz
          artifacts/cum-macos-arm64.tar.gz
          artifacts/cum-windows-x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
