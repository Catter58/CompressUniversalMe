name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            artifact: compressum
          - os: macos-latest
            name: macos-arm64
            artifact: compressum
          - os: windows-latest
            name: windows-x64
            artifact: compressum.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCOMPRESSUM_STATIC=ON

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCOMPRESSUM_STATIC=ON

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release -j

    - name: Package
      run: |
        mkdir -p dist
        cp build/${{ matrix.artifact }} dist/ 2>/dev/null || cp build/Release/${{ matrix.artifact }} dist/
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: compressum-${{ matrix.name }}
        path: dist/

  create-release:
    needs: build-release
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archives
      run: |
        cd artifacts
        for dir in */; do
          name="${dir%/}"
          cd "$name"
          tar -czvf "../${name}.tar.gz" *
          cd ..
        done

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
